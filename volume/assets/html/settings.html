<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' https://assets.afcdn.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com;">
    <meta http-equiv="X-Content-Security-Policy" content="default-src 'self'; script-src 'self'" />

    <script src="../../../../../node_modules/xel/xel.js" type="module"></script>
    <meta name="xel-theme" content="../../../../../node_modules/xel/themes/adwaita-dark.css">
    <meta name="xel-accent-color" content="blue">
    <meta name="xel-icons" content="">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="logo"><img src="../images/audio.png">
            <div id="label-title"></div>
        </div>
    </header>

    <main class="content">
        <div class="container">
            <x-card class="hidden" id="calendar-infos">
                <x-box class="slider">
                    <x-slider id="set-volume" value="2" step="2" ticks size="small"></x-slider>
                </x-box>
                <x-box class="icon-container">
                    <x-box class="icon"><img id="set-mute" src="../images/volume.png"></x-box>
                    <x-box class="icon"><img id="set-unmute" src="../images/unmute.png"></x-box>
                </x-box>
            </x-card>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="notification-container">
                <div id="notification" class="notification hidden"></div>
            </div>
        </div>
        <div class="footer-buttons">
            <x-button id="close-button" class="button button-close"></x-button>
        </div>

    </footer>
    <script src="./settings-renderer.js"></script>
</body>

</html>
